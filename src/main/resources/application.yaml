server:
  port: 8080

spring:
  application:
    name: cursovalido-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  
  datasource:
    url: jdbc:postgresql://localhost:5432/cursovalido-backend
    username: postgres
    password: docker

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

aplicacao:
  url: ${APLICACAO_URL:http://localhost:3000}
  frontend-origens: ${APLICACAO_FRONTEND_ORIGENS:http://localhost:3000,http://localhost:5173}
  email-remetente: ${APLICACAO_EMAIL_REMETENTE:onboarding@cursovalido.dev}

resend:
  api-url: ${RESEND_API_URL:https://api.resend.com}
  api-key: ${RESEND_API_KEY:re_3Lx4CKCt_NzcPbw4wb57W51q5UFiYNNiP}

seguranca:
  auditoria:
    chave: ${AUDITORIA_CHAVE:chave-de-auditoria-local-com-32-caracteres}
  jwt:
    chave: ${JWT_CHAVE:chave-secreta-do-curso-valido-com-mais-de-32-caracteres}
    expiracao-ms: 86400000
  permissoes:
    administrador:
      - "/api/forum/**"
    leitura-professor:
      - "/api/forum/**"
    escrita-professor:
      - "/api/forum/topicos"
      - "/api/forum/topicos/*"
      - "/api/forum/topicos/*/comentarios"
      - "/api/forum/comentarios/*"
    leitura-aluno:
      - "/api/forum/topicos"
      - "/api/forum/topicos/**"
      - "/api/forum/users"
      - "/api/forum/topicos/*/comentarios"
    escrita-aluno:
      - "/api/forum/topicos"
      - "/api/forum/topicos/*/comentarios"
      - "/api/forum/comentarios/*"
      - "/api/forum/topicos/*/fechar"
