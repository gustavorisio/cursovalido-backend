spring.application.name=minha-api
aplicacao.suporte.email=${SUPPORT_EMAIL:}
seguranca.https-obrigatorio=${REQUIRE_HTTPS:false}

# Credenciais utilizadas apenas na primeira criacao do administrador principal.
aplicacao.admin.email=${ADMIN_EMAIL:}
aplicacao.admin.senha=${ADMIN_PASSWORD:}

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minha_api}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GMAIL SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SERVER
server.port=${SERVER_PORT:8080}

# SECURITY / JWT / BCRYPT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:3600000}
security.bcrypt.strength=${BCRYPT_STRENGTH:12}

# EXTERNAL APIS
external.cpfcnpj.base-url=https://api.cpfcnpj.com.br
external.cpfcnpj.token=${CPFCNPJ_TOKEN:}
external.cpfcnpj.connect-timeout-ms=3000
external.cpfcnpj.read-timeout-ms=60000
external.resend.base-url=https://api.resend.com
external.resend.api-key=${RESEND_API_KEY}
external.resend.from-email=${RESEND_FROM_EMAIL}
external.youtube.base-url=https://www.googleapis.com/youtube/v3
external.youtube.api-key=${YOUTUBE_API_KEY:}
external.youtube.connect-timeout-ms=3000
external.youtube.read-timeout-ms=5000

# Propriedades utilizadas pelos servicos da aplicacao
seguranca.jwt.chave=${JWT_SECRET}
seguranca.jwt.expiracao-ms=${JWT_EXPIRATION:3600000}
seguranca.auditoria.chave=${AUDITORIA_CHAVE}
resend.api-url=${external.resend.base-url}
resend.api-key=${RESEND_API_KEY}
aplicacao.email-remetente=${RESEND_FROM_EMAIL}
aplicacao.url=${APP_URL:http://localhost:3000}
aplicacao.frontend-origens=${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
