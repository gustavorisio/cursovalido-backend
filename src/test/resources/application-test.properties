spring.datasource.url=jdbc:h2:mem:cursovalido;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
seguranca.jwt.chave=chave-de-teste-com-mais-de-32-caracteres
seguranca.jwt.expiracao-ms=86400000
aplicacao.frontend-origens=http://localhost:3000
